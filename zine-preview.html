<!DOCTYPE html>

<style>
html,body{margin:0;padding:0;height:100%}body{background:url("Gore.png") no-repeat center center fixed;background-size:cover;overflow:hidden}.y2k-wire{position:fixed;top:0;left:0;width:100%;height:44px;background:#fff;overflow:hidden;white-space:nowrap;z-index:9999}.wire-track{height:100%;display:flex;align-items:center;width:max-content;will-change:transform;animation:wire-scroll 60s linear infinite}.wire-copy{display:inline-flex;align-items:center;flex-shrink:0}.wire-brand,.wire-time,.wire-story,.wire-separator{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:24px;line-height:44px;color:#000;text-transform:uppercase;letter-spacing:.35px}.wire-brand{margin-right:18px}.wire-time{margin-right:22px}.wire-story{color:#000;text-decoration:none}.wire-story:hover,.wire-story:focus{text-decoration:underline}.wire-separator{margin:0 20px}@keyframes wire-scroll{from{transform:translateX(-50%)}to{transform:translateX(0)}}.y2k-wire:hover .wire-track{animation-play-state:paused}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-15px)}100%{transform:translateY(0)}}.logo{width:520px;max-width:85%;height:auto;animation:float 3s ease-in-out infinite;cursor:pointer;display:block;margin:0 auto}.container{height:100%;display:flex;justify-content:center;padding-top:11vh;text-align:center}.sidebar{position:fixed;left:25px;top:50%;transform:translateY(-50%);width:100px;padding:18px 10px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.20);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.45);z-index:10}.nav{display:flex;flex-direction:column;align-items:center;gap:20px}.nav a{display:block}.nav a img{width:78px;height:78px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.85)) drop-shadow(0 0 6px rgba(0,0,0,.5));transition:transform .2s ease,filter .2s ease}.nav a img:hover{transform:scale(1.10);filter:drop-shadow(0 3px 6px rgba(0,0,0,.9)) drop-shadow(0 0 8px rgba(255,255,255,.25))}.issue-shelf{position:fixed;left:50%;top:45%;transform:translateX(-50%);display:flex;align-items:flex-start;justify-content:center;gap:58px;z-index:8}.issue-card{display:flex;flex-direction:column;align-items:center;text-decoration:none}.issue-card img{display:block;width:min(315px,26vw);max-height:48vh;object-fit:contain;filter:drop-shadow(0 10px 22px rgba(0,0,0,.7));transition:transform .18s ease,filter .18s ease}.issue-card-title{margin-top:10px;font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:40px;line-height:1;color:#fff;text-transform:uppercase;letter-spacing:.5px;text-shadow:0 3px 7px #000}.issue-year{margin-top:4px;font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:20px;line-height:1;color:#fff;letter-spacing:.5px;text-shadow:0 2px 5px #000}.issue-card:hover img,.issue-card:focus img{transform:translateY(-4px) scale(1.015);filter:drop-shadow(0 14px 28px rgba(0,0,0,.82))}.issue-card:hover .issue-card-title,.issue-card:focus .issue-card-title{text-decoration:underline}.preview-tag{position:fixed;right:14px;bottom:12px;z-index:20;font-family:Arial,sans-serif;font-size:11px;color:#fff;background:rgba(0,0,0,.7);padding:5px 8px}.preview-tag a{color:#fff}@media(max-width:900px){.issue-shelf{top:46%;gap:28px}.issue-card img{width:min(260px,31vw);max-height:44vh}.issue-card-title{font-size:31px}.issue-year{font-size:17px}}@media(max-width:700px){body{overflow:auto;background-attachment:scroll}.y2k-wire{height:38px}.wire-brand,.wire-time,.wire-story,.wire-separator{font-size:20px;line-height:38px}.wire-separator{margin:0 14px}.sidebar{left:12px;width:72px;padding:12px 6px}.nav{gap:14px}.nav a img{width:58px;height:58px}.logo{width:360px}.container{height:auto;padding-top:9vh}.issue-shelf{position:relative;left:auto;top:auto;transform:none;margin:25vh auto 60px;width:100%;box-sizing:border-box;padding:0 20px 0 105px;flex-direction:column;align-items:center;gap:34px}.issue-card img{width:min(270px,68vw);max-height:none}.issue-card-title{font-size:30px;margin-top:8px}.issue-year{font-size:17px}.preview-tag{position:fixed;font-size:9px}}@media(prefers-reduced-motion:reduce){.wire-track,.logo{animation:none}}
</style>
</head>
<body>
<div class="y2k-wire" aria-label="Y2K Wire live news ticker"><div class="wire-track" id="wireTrack"></div></div>
<div class="sidebar"><div class="nav"><a href="https://instagram.com/year2kill.chi" target="_blank" rel="noopener noreferrer"><img src="instagram.png" alt="Instagram"></a><a href="index.html"><img src="Y2K2.png" alt="YEAR2KILL Archive"></a><a href="sarafim.html"><img src="Sarafim.png" alt="SARAFIM"></a></div></div>
<div class="container"><div><a href="index3.html"><img src="y2k2026.png" alt="YEAR2KILL" class="logo"></a></div></div>
<div class="issue-shelf" aria-label="YEAR2KILL issues">
  <a class="issue-card" href="issue-01/"><img src="issue1-cover-web.jpg" alt="YEAR2KILL Issue 1 cover"><span class="issue-card-title">VIEW ISSUE 1</span><span class="issue-year">(2024)</span></a>
  <a class="issue-card" href="issue-02/"><img src="issue2-cover-web.jpg" alt="YEAR2KILL Issue 2 cover"><span class="issue-card-title">VIEW ISSUE 2</span><span class="issue-year">(2026)</span></a>
</div>
<div class="preview-tag">PREVIEW ONLY · <a href="index.html">BACK TO LIVE HOME</a></div>
<script>
const track=document.getElementById('wireTrack');let currentSignature='',pendingData=null;const OFFLINE={stories:[{headline:'Y2K WIRE // LIVE FEED TEMPORARILY UNAVAILABLE',url:'#',source:'YEAR2KILL'}]};function localDateTime(){const now=new Date();const date=new Intl.DateTimeFormat(undefined,{month:'2-digit',day:'2-digit',year:'numeric'}).format(now);const time=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(now);return `${date} ${time}`}function signature(data){return JSON.stringify((data.stories||[]).map(s=>[s.headline,s.url,s.published]))}function buildCopy(stories){const copy=document.createElement('div');copy.className='wire-copy';const brand=document.createElement('span');brand.className='wire-brand';brand.textContent='Y2K WIRE >>>';copy.appendChild(brand);const time=document.createElement('span');time.className='wire-time live-time';time.textContent=localDateTime();copy.appendChild(time);for(const story of stories){const sep=document.createElement('span');sep.className='wire-separator';sep.textContent='--';copy.appendChild(sep);const link=document.createElement('a');link.className='wire-story';link.textContent=story.headline;link.href=story.url||'#';if(story.url&&story.url!=='#'){link.target='_blank';link.rel='noopener noreferrer'}link.title=story.source||'Y2K WIRE';copy.appendChild(link)}const end=document.createElement('span');end.className='wire-separator';end.textContent='>>>';copy.appendChild(end);return copy}function updateClock(){document.querySelectorAll('.live-time').forEach(el=>el.textContent=localDateTime())}function adaptSpeed(){requestAnimationFrame(()=>{const copy=track.querySelector('.wire-copy');if(!copy)return;const pxPerSecond=window.innerWidth<=700?76:92;track.style.animationDuration=`${Math.max(40,copy.scrollWidth/pxPerSecond)}s`})}function render(data){const stories=(data.stories||[]).filter(s=>s&&s.headline).slice(0,100);if(!stories.length)stories.push(...OFFLINE.stories);track.replaceChildren(buildCopy(stories),buildCopy(stories));currentSignature=signature({stories});updateClock();adaptSpeed()}async function fetchWire(){const r=await fetch(`wire.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`wire.json ${r.status}`);return await r.json()}async function initialLoad(){try{render(await fetchWire())}catch(err){console.warn('Y2K WIRE:',err);render(OFFLINE)}}async function checkFreshFeed(){try{const data=await fetchWire();if(signature(data)!==currentSignature)pendingData=data}catch(err){console.warn('Y2K WIRE refresh:',err)}}track.addEventListener('animationiteration',()=>{if(pendingData){const next=pendingData;pendingData=null;render(next)}});window.addEventListener('resize',adaptSpeed);initialLoad();setInterval(updateClock,30000);setInterval(checkFreshFeed,10*60*1000);
</script>
</body>
