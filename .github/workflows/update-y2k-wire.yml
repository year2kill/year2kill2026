name: Update Y2K Wire

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "sources.json"
      - "requirements.txt"
      - "scripts/build_wire.py"
      - ".github/workflows/update-y2k-wire.yml"

permissions:
  contents: write

concurrency:
  group: y2k-wire
  cancel-in-progress: true

jobs:
  update-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build wire
        run: python scripts/build_wire.py

      - name: Commit updated wire
        run: |
          if git diff --quiet -- wire.json; then
            echo "No wire changes."
            exit 0
          fi
          git config user.name "Y2K Wire"
          git config user.email "actions@users.noreply.github.com"
          git add wire.json
          git commit -m "Update Y2K Wire"
          git push
