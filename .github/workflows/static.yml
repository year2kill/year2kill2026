name: Deploy YEAR2KILL with live Y2K Wire

on:
  push:
    branches: ["main"]
  schedule:
    # Refresh and redeploy the news wire once per hour.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Y2K Wire dependencies
        run: python -m pip install -r requirements.txt

      - name: Build live Y2K Wire
        run: python scripts/build_wire.py

      - name: Verify live feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("wire.json").read_text(encoding="utf-8"))
          stories = data.get("stories", [])
          if len(stories) < 8:
              raise SystemExit(f"Refusing deployment: only {len(stories)} Wire stories were generated")
          print(f"Verified {len(stories)} Y2K Wire stories")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
