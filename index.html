<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YEAR2KILL</title>
<link rel="icon" type="image/png" href="Y2K2.png">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{background:url("Gore.png") no-repeat center center fixed;background-size:cover;min-height:100dvh;overflow:hidden}.y2k-wire{position:fixed;top:0;left:0;width:100%;height:44px;background:#fff;overflow:hidden;white-space:nowrap;z-index:50}.wire-track{height:100%;display:flex;align-items:center;width:max-content;will-change:transform;animation:wire-scroll 60s linear infinite}.wire-copy{display:inline-flex;align-items:center;flex-shrink:0}.wire-brand,.wire-time,.wire-story,.wire-separator{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:24px;line-height:44px;color:#000;text-transform:uppercase;letter-spacing:.35px}.wire-brand{margin-right:18px}.wire-time{margin-right:22px}.wire-story{color:#000;text-decoration:none}.wire-story:hover{text-decoration:underline}.wire-separator{margin:0 20px}@keyframes wire-scroll{from{transform:translateX(-50%)}to{transform:translateX(0)}}.y2k-wire:hover .wire-track{animation-play-state:paused}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}.home{min-height:100dvh;padding-top:66px;display:flex;flex-direction:column;align-items:center}.logo-wrap{height:210px;display:flex;align-items:flex-start;justify-content:center;padding-top:18px}.logo{width:520px;max-width:80vw;height:auto;animation:float 3s ease-in-out infinite;display:block;margin:0 auto}.sidebar{position:fixed;left:25px;top:50%;transform:translateY(-50%);width:100px;padding:18px 10px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.20);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.45);z-index:20}.nav{display:flex;flex-direction:column;align-items:center;gap:20px}.nav img{width:78px;height:78px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.85));transition:.2s transform ease}.nav img:hover{transform:scale(1.08)}.issue-shelf{display:flex;justify-content:center;align-items:flex-start;gap:58px;margin-top:170px;padding:0 130px 28px}.issue-card{border:0;background:none;padding:0;color:#fff;display:flex;flex-direction:column;align-items:center;cursor:pointer;text-decoration:none}.issue-card img{width:min(300px,25vw);max-height:46vh;object-fit:contain;display:block;filter:drop-shadow(0 10px 22px rgba(0,0,0,.72));transition:.18s transform ease,.18s filter ease}.issue-card:hover img,.issue-card:focus-visible img{transform:translateY(-4px) scale(1.015);filter:drop-shadow(0 14px 28px rgba(0,0,0,.84))}.issue-title{margin-top:10px;font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:38px;line-height:.95;text-shadow:0 3px 7px #000}.issue-year{margin-top:6px;font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:20px;text-shadow:0 2px 5px #000}
.reader-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);opacity:0;transition:opacity 180ms ease}.reader-modal.open{display:flex}.reader-modal.visible{opacity:1}.reader-ui{width:100%;height:100%;display:grid;grid-template-rows:52px minmax(0,1fr) 58px;position:relative}.reader-top{display:flex;align-items:center;justify-content:flex-end;padding:6px 14px}.close-btn{width:44px;height:44px;border:0;background:rgba(0,0,0,.28);color:#fff;font:36px/1 Arial;cursor:pointer;border-radius:50%}.reader-stage{display:flex;align-items:center;justify-content:center;min-height:0;padding:4px 18px}.pages{display:flex;justify-content:center;align-items:center;max-width:94vw;max-height:calc(100dvh - 122px);filter:drop-shadow(0 18px 32px rgba(0,0,0,.58));transition:opacity 190ms ease,transform 190ms ease}.pages.changing{opacity:0;transform:translateX(var(--shift,0))}.page-wrap{position:relative;display:flex;align-items:center;justify-content:center;background:#111;overflow:hidden;line-height:0;isolation:isolate}.page-wrap.hidden{display:none}.page{display:block;background:transparent!important;border:0!important;outline:0!important;box-shadow:none!important;object-fit:contain;height:min(78dvh,calc(47vw * 11 / 8.5));width:auto;max-width:47vw;aspect-ratio:8.5/11;transform:translateZ(0)}.page.right{border:0!important}.page-error{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:#111;color:#fff;font:700 13px/1.4 Arial;letter-spacing:.8px}.page-wrap.error .page{visibility:hidden}.page-wrap.error .page-error{display:flex}.reader-controls{display:flex;justify-content:center;align-items:center;gap:10px;color:#fff;padding:0 12px}.reader-controls button{border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.38);color:#fff;padding:9px 14px;cursor:pointer;font-weight:700}.reader-controls button:disabled{opacity:.35;cursor:default}.counter{min-width:110px;text-align:center;font:700 11px Arial;letter-spacing:1.1px}body.reader-open{overflow:hidden}body.reader-open .wire-track,body.reader-open .logo{animation-play-state:paused}
@media(max-width:700px){body{overflow:auto;background-attachment:scroll}.y2k-wire{height:38px}.wire-brand,.wire-time,.wire-story,.wire-separator{font-size:20px;line-height:38px}.wire-separator{margin:0 14px}.home{padding-top:52px;min-height:100dvh}.logo-wrap{height:138px;padding-top:10px}.logo{width:300px;max-width:72vw}.issue-shelf{width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:0 12px;margin-top:32px;align-items:start}.issue-card{min-width:0;width:100%}.issue-card img{width:100%;max-width:100%;max-height:none}.issue-title{font-size:clamp(17px,5vw,22px);margin-top:8px;white-space:nowrap}.issue-year{font-size:13px;margin-top:3px}.sidebar{position:relative;left:auto;top:auto;transform:none;width:auto;padding:8px 12px;margin:22px auto 26px;border-radius:12px}.nav{flex-direction:row;gap:18px}.nav img{width:52px;height:52px}.reader-ui{grid-template-rows:48px minmax(0,1fr) 56px}.reader-stage{padding:0 12px}.pages{max-width:100%;max-height:calc(100dvh - 108px)}.page-wrap.right-wrap{display:none!important}.page{height:auto;width:min(calc(100vw - 24px),calc((100dvh - 118px)*8.5/11));max-width:none;max-height:calc(100dvh - 118px)}.close-btn{width:42px;height:42px;font-size:32px}.reader-controls button{padding:9px 12px}.counter{min-width:82px}.reader-controls #fullBtn{display:none}}
@media(prefers-reduced-motion:reduce){.wire-track,.logo,.reader-modal,.pages{animation:none;transition:none}}
</style>
</head>
<body>
<div class="y2k-wire" aria-label="Y2K Wire live news ticker"><div class="wire-track" id="wireTrack"></div></div>
<main class="home">
  <div class="logo-wrap"><a href="index.html"><img class="logo" src="y2k2026.png" alt="YEAR2KILL"></a></div>
  <section class="issue-shelf" aria-label="YEAR2KILL issues">
    <button class="issue-card" data-issue="1"><img src="issue1-cover-web.jpg" alt="YEAR2KILL Issue 1"><span class="issue-title">VIEW ISSUE 1</span><span class="issue-year">(2024)</span></button>
    <button class="issue-card" data-issue="2"><img src="issue2-cover-web.jpg" alt="YEAR2KILL Issue 2"><span class="issue-title">VIEW ISSUE 2</span><span class="issue-year">(2026)</span></button>
  </section>
  <div class="sidebar"><div class="nav"><a href="https://instagram.com/year2kill.chi" target="_blank" rel="noopener noreferrer"><img src="instagram.png" alt="Instagram"></a><a href="index.html"><img src="Y2K2.png" alt="YEAR2KILL Archive"></a><a href="sarafim.html"><img src="Sarafim.png" alt="Sarafim"></a></div></div>
</main>
<div class="reader-modal" id="readerModal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="YEAR2KILL zine reader">
  <div class="reader-ui">
    <div class="reader-top"><button class="close-btn" id="closeReader" aria-label="Close reader">×</button></div>
    <div class="reader-stage" id="readerStage">
      <div class="pages" id="pages">
        <div class="page-wrap left-wrap" id="leftWrap"><img class="page left" id="leftPage" alt="YEAR2KILL page"><div class="page-error">PAGE FAILED TO LOAD.</div></div>
        <div class="page-wrap right-wrap" id="rightWrap"><img class="page right" id="rightPage" alt="YEAR2KILL page"><div class="page-error">PAGE FAILED TO LOAD.</div></div>
      </div>
    </div>
    <div class="reader-controls"><button id="prevBtn" aria-label="Previous page">←</button><span class="counter" id="counter"></span><button id="nextBtn" aria-label="Next page">→</button><button id="fullBtn">FULLSCREEN</button></div>
  </div>
</div>
<script>
const track=document.getElementById('wireTrack');
const OFFLINE={stories:[{headline:'Y2K WIRE // LIVE FEED TEMPORARILY UNAVAILABLE',url:'#',source:'YEAR2KILL'}]};
function localDateTime(){const n=new Date(),d=new Intl.DateTimeFormat(undefined,{month:'2-digit',day:'2-digit',year:'numeric'}).format(n),t=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(n);return `${d} ${t}`}
function buildCopy(stories){const c=document.createElement('div');c.className='wire-copy';const b=document.createElement('span');b.className='wire-brand';b.textContent='Y2K WIRE >>>';c.appendChild(b);const tm=document.createElement('span');tm.className='wire-time live-time';tm.textContent=localDateTime();c.appendChild(tm);for(const s of stories){const sep=document.createElement('span');sep.className='wire-separator';sep.textContent='--';c.appendChild(sep);const a=document.createElement('a');a.className='wire-story';a.textContent=s.headline;a.href=s.url||'#';if(s.url&&s.url!=='#'){a.target='_blank';a.rel='noopener noreferrer'}c.appendChild(a)}return c}
function updateClock(){document.querySelectorAll('.live-time').forEach(e=>e.textContent=localDateTime())}
function adaptSpeed(){requestAnimationFrame(()=>{const c=track.querySelector('.wire-copy');if(c)track.style.animationDuration=`${Math.max(40,c.scrollWidth/(innerWidth<=700?76:92))}s`})}
function renderWire(d){const s=(d.stories||[]).filter(x=>x&&x.headline).slice(0,100);if(!s.length)s.push(...OFFLINE.stories);track.replaceChildren(buildCopy(s),buildCopy(s));updateClock();adaptSpeed()}
async function loadWire(){try{const r=await fetch(`wire.json?v=${Date.now()}`,{cache:'no-store'});renderWire(r.ok?await r.json():OFFLINE)}catch{renderWire(OFFLINE)}}
loadWire();setInterval(updateClock,30000);window.addEventListener('resize',adaptSpeed);
const ISSUES={1:{total:24,ext:'webp',folder:'issue-01/pages'},2:{total:60,ext:'webp',folder:'issue-02/pages'}};
const modal=document.getElementById('readerModal'),pages=document.getElementById('pages'),left=document.getElementById('leftPage'),right=document.getElementById('rightPage'),leftWrap=document.getElementById('leftWrap'),rightWrap=document.getElementById('rightPage'),counter=document.getElementById('counter'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
let activeIssue=1,pos=1,busy=false,downX=null;
const isMobile=()=>matchMedia('(max-width:700px)').matches;
function srcFor(n){const m=ISSUES[activeIssue];return `${m.folder}/page_${String(n).padStart(2,'0')}.${m.ext}`}
function showPage(img,wrap,n){const m=ISSUES[activeIssue];if(!n||n<1||n>m.total){wrap.classList.add('hidden');return}wrap.classList.remove('hidden','error');img.onload=()=>wrap.classList.remove('error');img.onerror=()=>wrap.classList.add('error');img.src=srcFor(n)}
function spread(){const t=ISSUES[activeIssue].total;if(isMobile())return[pos];if(pos===1||pos===t)return[pos];const l=pos%2===0?pos:pos-1;return[l,l+1]}
function preloadAround(){const t=ISSUES[activeIssue].total;for(let d=-2;d<=3;d++){const n=pos+d;if(n>=1&&n<=t){const im=new Image();im.src=srcFor(n)}}}
function renderReader(){const s=spread(),t=ISSUES[activeIssue].total;showPage(left,leftWrap,s[0]);if(s[1])showPage(right,rightWrap,s[1]);else rightWrap.classList.add('hidden');counter.textContent=s.length===1?`${String(s[0]).padStart(2,'0')} / ${t}`:`${String(s[0]).padStart(2,'0')}–${String(s[1]).padStart(2,'0')} / ${t}`;prevBtn.disabled=s[0]<=1;nextBtn.disabled=s[s.length-1]>=t;preloadAround()}
function openReader(i){activeIssue=+i;pos=1;renderReader();modal.classList.add('open');requestAnimationFrame(()=>modal.classList.add('visible'));modal.setAttribute('aria-hidden','false');document.body.classList.add('reader-open');document.getElementById('closeReader').focus()}
function closeReader(){modal.classList.remove('visible');setTimeout(()=>modal.classList.remove('open'),180);modal.setAttribute('aria-hidden','true');document.body.classList.remove('reader-open')}
function nextPos(dir){const t=ISSUES[activeIssue].total;if(isMobile())return Math.max(1,Math.min(t,pos+dir));if(pos===1&&dir>0)return 2;if(pos===t&&dir<0)return Math.max(1,t-2);return Math.max(1,Math.min(t,pos+dir*2))}
function step(dir){if(busy)return;const np=nextPos(dir);if(np===pos)return;busy=true;pages.style.setProperty('--shift',dir>0?'-5px':'5px');pages.classList.add('changing');setTimeout(()=>{pos=np;renderReader();pages.style.setProperty('--shift',dir>0?'5px':'-5px');requestAnimationFrame(()=>{pages.classList.remove('changing');pages.style.setProperty('--shift','0');busy=false})},130)}
document.querySelectorAll('.issue-card').forEach(b=>b.addEventListener('click',()=>openReader(b.dataset.issue)));
document.getElementById('closeReader').addEventListener('click',closeReader);nextBtn.addEventListener('click',()=>step(1));prevBtn.addEventListener('click',()=>step(-1));
document.getElementById('fullBtn').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await modal.requestFullscreen();else await document.exitFullscreen()}catch{}});
document.addEventListener('keydown',e=>{if(!modal.classList.contains('open'))return;if(e.key==='Escape')closeReader();else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
document.getElementById('readerStage').addEventListener('pointerdown',e=>downX=e.clientX);document.getElementById('readerStage').addEventListener('pointerup',e=>{if(downX==null)return;const d=e.clientX-downX;downX=null;if(Math.abs(d)>45)(d<0?step(1):step(-1))});
matchMedia('(max-width:700px)').addEventListener?.('change',()=>{if(modal.classList.contains('open'))renderReader()});
</script>
</body>
</html>
