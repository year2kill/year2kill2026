<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YEAR2KILL Issue 02</title>
<link rel="stylesheet" href="reader.css">
</head>
<body>
<main class="reader" id="reader">
  <section class="stage" id="stage" aria-label="YEAR2KILL Issue 02 reader">
    <div class="book-shell" id="bookShell">
      <div class="single-view" id="singleView"><img id="singlePage" alt="YEAR2KILL page"></div>
      <div class="spread-view" id="spreadView" hidden><img id="leftPage" alt="YEAR2KILL left page"><img id="rightPage" alt="YEAR2KILL right page"></div>
    </div>
  </section>
  <nav class="controls" aria-label="Reader controls">
    <button id="openButton">OPEN ISSUE</button>
    <div id="readingControls" hidden><button id="prevButton" aria-label="Previous">←</button><span id="counter">01 / 60</span><button id="nextButton" aria-label="Next">→</button><button id="fullButton">FULLSCREEN</button></div>
  </nav>
</main>
<script src="reader.js"></script>
</body>
</html>
