<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SARAFIM — v0.0.1 Preview</title>
<link rel="icon" type="image/png" href="Y2K2.png">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{background:url("Gore.png") no-repeat center center fixed;background-size:cover;min-height:100dvh;overflow:hidden}.y2k-wire{position:fixed;top:0;left:0;width:100%;height:44px;background:#fff;overflow:hidden;white-space:nowrap;z-index:50}.wire-track{height:100%;display:flex;align-items:center;width:max-content;will-change:transform;animation:wire-scroll 60s linear infinite}.wire-copy{display:inline-flex;align-items:center;flex-shrink:0}.wire-brand,.wire-time,.wire-story,.wire-separator{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:24px;line-height:44px;color:#000;text-transform:uppercase;letter-spacing:.35px}.wire-brand{margin-right:18px}.wire-time{margin-right:22px}.wire-story{color:#000;text-decoration:none}.wire-story:hover{text-decoration:underline}.wire-separator{margin:0 20px}@keyframes wire-scroll{from{transform:translateX(-50%)}to{transform:translateX(0)}}.y2k-wire:hover .wire-track{animation-play-state:paused}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}.logo{width:520px;max-width:80vw;height:auto;animation:float 3s ease-in-out infinite;display:block;margin:0 auto}.logo-wrap{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:5}.sidebar{position:fixed;left:25px;top:50%;transform:translateY(-50%);width:100px;padding:18px 10px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.20);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.45);z-index:20}.nav{display:flex;flex-direction:column;align-items:center;gap:20px}.nav img{width:78px;height:78px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.85))}.sarafim-stage{min-height:100dvh;padding:240px 120px 45px 150px;display:flex;align-items:center;justify-content:center}.sarafim-content{display:flex;align-items:center;justify-content:center;gap:54px;width:min(1050px,78vw)}.sarafim-art{width:min(430px,37vw);max-height:62vh;object-fit:contain;display:block;filter:drop-shadow(0 12px 24px rgba(0,0,0,.6))}.sarafim-copy{width:min(430px,38vw);color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.9)}.sarafim-copy h1{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:clamp(54px,6vw,88px);line-height:.86;letter-spacing:.5px;margin:0 0 9px;text-transform:uppercase}.version{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:24px;letter-spacing:1.2px;margin:0 0 20px}.description{font-size:17px;line-height:1.45;max-width:390px;margin:0 0 25px;font-weight:600}.platform{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:15px;letter-spacing:1px;margin-bottom:9px}.download{display:inline-block;border:2px solid #fff;background:#000;color:#fff;text-decoration:none;font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:25px;letter-spacing:.6px;padding:12px 18px;cursor:default}.download.pending{opacity:.72}.note{font-size:11px;margin-top:9px;opacity:.78;letter-spacing:.35px}.preview-label{position:fixed;right:12px;bottom:10px;color:#fff;background:rgba(0,0,0,.7);padding:5px 8px;font-size:11px;z-index:30}
@media(max-width:700px){body{overflow:auto;background-attachment:scroll}.y2k-wire{height:38px}.wire-brand,.wire-time,.wire-story,.wire-separator{font-size:20px;line-height:38px}.wire-separator{margin:0 14px}.logo-wrap{position:relative;top:auto;left:auto;transform:none;padding-top:62px}.logo{width:300px;max-width:72vw}.sarafim-stage{padding:22px 18px 34px;min-height:auto}.sarafim-content{width:100%;display:flex;flex-direction:column;gap:18px}.sarafim-art{width:min(72vw,360px);max-height:none}.sarafim-copy{width:min(88vw,420px);text-align:center}.sarafim-copy h1{font-size:58px}.version{font-size:21px;margin-bottom:15px}.description{font-size:15px;line-height:1.4;margin-left:auto;margin-right:auto}.download{font-size:22px}.sidebar{position:relative;left:auto;top:auto;transform:none;width:auto;padding:8px 12px;margin:12px auto 24px;display:table}.nav{flex-direction:row;gap:18px}.nav img{width:52px;height:52px}.preview-label{display:none}}
@media(prefers-reduced-motion:reduce){.wire-track,.logo{animation:none}}
</style>
</head>
<body>
<div class="y2k-wire" aria-label="Y2K Wire live news ticker"><div class="wire-track" id="wireTrack"></div></div>
<div class="logo-wrap"><a href="index.html"><img class="logo" src="y2k2026.png" alt="YEAR2KILL"></a></div>
<main class="sarafim-stage">
  <section class="sarafim-content" aria-label="Sarafim v0.0.1">
    <img class="sarafim-art" src="angel2.png" alt="Sarafim v0.0.1 official angel icon">
    <div class="sarafim-copy">
      <h1>SARAFIM</h1>
      <div class="version">v0.0.1</div>
      <p class="description">An intelligent art system for creative workflow, local AI assistance, file tools, and YEAR2KILL. The first public build of Sarafim.</p>
      <div class="platform">WINDOWS</div>
      <span class="download pending">DOWNLOAD SARAFIM</span>
      <div class="note">Installer link will be enabled when the v0.0.1 setup file is added.</div>
    </div>
  </section>
</main>
<div class="sidebar"><div class="nav"><a href="https://instagram.com/year2kill.chi" target="_blank" rel="noopener noreferrer"><img src="instagram.png" alt="Instagram"></a><a href="index.html"><img src="Y2K2.png" alt="YEAR2KILL"></a><a href="sarafim.html"><img src="Sarafim.png" alt="Sarafim"></a></div></div>
<div class="preview-label">SARAFIM PAGE PREVIEW</div>
<script>
const track=document.getElementById('wireTrack');const OFFLINE={stories:[{headline:'Y2K WIRE // LIVE FEED TEMPORARILY UNAVAILABLE',url:'#'}]};function localDateTime(){const n=new Date(),d=new Intl.DateTimeFormat(undefined,{month:'2-digit',day:'2-digit',year:'numeric'}).format(n),t=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(n);return `${d} ${t}`}function buildCopy(stories){const c=document.createElement('div');c.className='wire-copy';const b=document.createElement('span');b.className='wire-brand';b.textContent='Y2K WIRE >>>';c.appendChild(b);const tm=document.createElement('span');tm.className='wire-time live-time';tm.textContent=localDateTime();c.appendChild(tm);for(const s of stories){const sep=document.createElement('span');sep.className='wire-separator';sep.textContent='--';c.appendChild(sep);const a=document.createElement('a');a.className='wire-story';a.textContent=s.headline;a.href=s.url||'#';if(s.url&&s.url!=='#'){a.target='_blank';a.rel='noopener noreferrer'}c.appendChild(a)}return c}function updateClock(){document.querySelectorAll('.live-time').forEach(e=>e.textContent=localDateTime())}function adaptSpeed(){requestAnimationFrame(()=>{const c=track.querySelector('.wire-copy');if(c)track.style.animationDuration=`${Math.max(40,c.scrollWidth/(innerWidth<=700?76:92))}s`})}function renderWire(d){const s=(d.stories||[]).filter(x=>x&&x.headline).slice(0,100);if(!s.length)s.push(...OFFLINE.stories);track.replaceChildren(buildCopy(s),buildCopy(s));updateClock();adaptSpeed()}async function loadWire(){try{const r=await fetch(`wire.json?v=${Date.now()}`,{cache:'no-store'});renderWire(r.ok?await r.json():OFFLINE)}catch{renderWire(OFFLINE)}}loadWire();setInterval(updateClock,30000);window.addEventListener('resize',adaptSpeed);
</script>
</body>
</html>
